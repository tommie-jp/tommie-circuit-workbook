@startuml
left to right direction
skinparam shadowing false
skinparam defaultFontName "Noto Sans CJK JP"
skinparam rectangle {
  RoundCorner 6
}

rectangle "SW1\n番地 A0〜A3" as SW1 #FFF8E1
rectangle "SW2\nデータ D0・D1、WE" as SW2 #FFF8E1
rectangle "S1\nSTROBE" as S1 #FFF8E1
rectangle "U5 74HC138\nE0 / E1 を作る" as DEC #E8F0FE
rectangle "U6 74HC245\n書くときだけ\nBL に値を出す" as DRV #E8F0FE
rectangle "U1〜U4 74HC4051\n+ 100 nF × 32\n2 ビット × 16 語" as MEM #E6F4EA
rectangle "U7 MCP6002\nコンパレータ × 2\n(1.24 V)" as CMP #FDECEA
rectangle "D1・D2 LED\n読んだ値" as LED #FDECEA

SW1 - -> MEM : A0〜A2 (S0〜S2)
SW1 - -> DEC : A3
S1 - -> DEC : STROBE
DEC - -> MEM : E0 (番地 0〜7)、E1 (8〜15)
SW2 - -> DRV : D0、D1、WE
DRV - -> MEM : BL0、BL1
MEM - -> CMP : BL0、BL1
CMP - -> LED
@enduml

