<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 860" width="980" height="860" font-family="'Noto Sans CJK JP','Noto Sans JP',sans-serif" font-size="15">
  <rect width="980" height="860" fill="#ffffff"/>
  <text x="20" y="32" font-size="20" font-weight="bold" fill="#000">図3 木造アパート 2 階の 6 畳での張り方の例 (未測定。寸法は目安)</text>

  <!-- ===== 上から見た図 ===== -->
  <text x="20" y="70" font-size="17" font-weight="bold" fill="#000">(a) 上から見た図</text>

  <!-- 部屋 3.5 m x 2.6 m (120 px/m) -->
  <rect x="60" y="100" width="420" height="312" fill="#fbf7ee" stroke="#444" stroke-width="4"/>
  <!-- 窓 (上の壁) -->
  <line x1="200" y1="100" x2="380" y2="100" stroke="#7fb3d5" stroke-width="8"/>
  <text x="290" y="90" text-anchor="middle" fill="#2e6f9e">窓</text>
  <!-- ドア (右の壁) -->
  <line x1="480" y1="300" x2="480" y2="390" stroke="#ffffff" stroke-width="6"/>
  <path d="M480,300 L410,300 A70,70 0 0 0 480,370" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="492" y="350" fill="#555">ドア</text>

  <!-- 机 1.0 m x 0.6 m (窓の角) -->
  <rect x="66" y="106" width="120" height="72" fill="#e6d3b3" stroke="#8a6d3b" stroke-width="1.5"/>
  <text x="126" y="166" text-anchor="middle" font-size="13" fill="#6b4f1d">机</text>
  <!-- tinySA -->
  <rect x="76" y="124" width="34" height="22" rx="3" fill="#333"/>
  <text x="93" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">T</text>

  <!-- ワイヤ (天井の近く、窓のある壁に沿う) -->
  <line x1="84" y1="112" x2="462" y2="112" stroke="#c0392b" stroke-width="4"/>
  <line x1="84" y1="112" x2="84" y2="124" stroke="#c0392b" stroke-width="4"/>
  <circle cx="84" cy="112" r="6" fill="#c0392b"/>
  <circle cx="462" cy="112" r="5" fill="#fff" stroke="#c0392b" stroke-width="2.5"/>
  <text x="70" y="96" font-weight="bold" fill="#c0392b">A</text>
  <text x="458" y="134" font-weight="bold" fill="#c0392b">B</text>

  <!-- カウンターポイズ (床、左の壁 → 窓の向かいの壁) -->
  <polyline points="76,146 72,160 72,400 372,400" fill="none" stroke="#2471a3" stroke-width="4" stroke-dasharray="10 5"/>
  <circle cx="372" cy="400" r="5" fill="#fff" stroke="#2471a3" stroke-width="2.5"/>
  <text x="80" y="392" font-weight="bold" fill="#2471a3">C</text>
  <text x="366" y="388" font-weight="bold" fill="#2471a3">D</text>

  <!-- 寸法 -->
  <g stroke="#000" stroke-width="1" fill="none">
    <line x1="60" y1="440" x2="480" y2="440"/><line x1="60" y1="432" x2="60" y2="448"/><line x1="480" y1="432" x2="480" y2="448"/>
    <line x1="30" y1="100" x2="30" y2="412"/><line x1="22" y1="100" x2="38" y2="100"/><line x1="22" y1="412" x2="38" y2="412"/>
  </g>
  <text x="270" y="460" text-anchor="middle">3.5 m</text>
  <text x="24" y="262" text-anchor="middle" transform="rotate(-90 24 262)">2.6 m</text>

  <!-- 凡例と説明 (右) -->
  <line x1="560" y1="118" x2="610" y2="118" stroke="#c0392b" stroke-width="4"/>
  <text x="622" y="123" fill="#c0392b" font-weight="bold">ワイヤ 5 m (天井の近く)</text>
  <text x="622" y="145" fill="#c0392b">T → A: 壁を 1.5 m 立ち上げる</text>
  <text x="622" y="165" fill="#c0392b">A → B: 窓のある壁を横に 3.5 m</text>
  <text x="622" y="185" fill="#c0392b">B の先はどこにもつながない</text>

  <line x1="560" y1="228" x2="610" y2="228" stroke="#2471a3" stroke-width="4" stroke-dasharray="10 5"/>
  <text x="622" y="233" fill="#2471a3" font-weight="bold">カウンターポイズ 5 m (床)</text>
  <text x="622" y="255" fill="#2471a3">T → C: 左の壁の巾木に沿って 約 2.5 m</text>
  <text x="622" y="275" fill="#2471a3">C → D: 窓の向かいの壁に沿って 約 2.5 m</text>
  <text x="622" y="295" fill="#2471a3">ワイヤ (A → B) の真下は通さない</text>
  <text x="622" y="315" fill="#2471a3">D はドアの手前で止め、被覆のまま置く</text>

  <rect x="566" y="350" width="34" height="22" rx="3" fill="#333"/>
  <text x="583" y="366" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">T</text>
  <text x="622" y="366" fill="#000">tinySA Ultra (机の上。電池で動かす)</text>
  <text x="622" y="388" fill="#000">A は T の真上 (天井の 20 cm 下)</text>

  <!-- ===== 横から見た図 ===== -->
  <text x="20" y="510" font-size="17" font-weight="bold" fill="#000">(b) 部屋の中から窓のある壁を見た図</text>

  <!-- 壁 3.5 m x 2.4 m -->
  <rect x="60" y="540" width="420" height="288" fill="#fbf7ee" stroke="#444" stroke-width="2"/>
  <line x1="50" y1="828" x2="500" y2="828" stroke="#444" stroke-width="4"/>
  <line x1="50" y1="540" x2="500" y2="540" stroke="#444" stroke-width="4"/>
  <text x="508" y="545" fill="#555">天井</text>
  <text x="508" y="833" fill="#555">床</text>

  <!-- 窓とカーテンレール -->
  <rect x="200" y="612" width="180" height="130" fill="#d6eaf8" stroke="#7fb3d5" stroke-width="2"/>
  <line x1="290" y1="612" x2="290" y2="742" stroke="#7fb3d5" stroke-width="1.5"/>
  <line x1="188" y1="598" x2="392" y2="598" stroke="#999" stroke-width="3"/>
  <text x="398" y="603" font-size="13" fill="#666">レール</text>
  <text x="290" y="684" text-anchor="middle" fill="#2e6f9e">窓</text>

  <!-- 机 (高さ 0.7 m) -->
  <rect x="66" y="740" width="120" height="6" fill="#8a6d3b"/>
  <line x1="72" y1="746" x2="72" y2="828" stroke="#8a6d3b" stroke-width="4"/>
  <line x1="180" y1="746" x2="180" y2="828" stroke="#8a6d3b" stroke-width="4"/>
  <rect x="80" y="718" width="34" height="22" rx="3" fill="#333"/>
  <text x="97" y="734" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">T</text>

  <!-- ワイヤ: 立ち上げ 1.5 m と水平 3.5 m (高さ 2.2 m) -->
  <polyline points="88,718 88,564 462,564" fill="none" stroke="#c0392b" stroke-width="4"/>
  <circle cx="88" cy="564" r="6" fill="#c0392b"/>
  <circle cx="462" cy="564" r="5" fill="#fff" stroke="#c0392b" stroke-width="2.5"/>
  <text x="68" y="560" font-weight="bold" fill="#c0392b">A</text>
  <text x="456" y="588" font-weight="bold" fill="#c0392b">B</text>

  <!-- カウンターポイズ: 机の脚に沿って床へ、左の壁を手前へ -->
  <polyline points="106,740 106,752 78,752 78,822 64,822" fill="none" stroke="#2471a3" stroke-width="4" stroke-dasharray="10 5"/>
  <text x="80" y="850" fill="#2471a3" font-size="13">床に降ろし、左の壁に沿って手前 (C) へ</text>

  <!-- 寸法 -->
  <g stroke="#000" stroke-width="1" fill="none">
    <line x1="120" y1="564" x2="120" y2="716"/><line x1="112" y1="716" x2="128" y2="716"/>
    <line x1="150" y1="550" x2="150" y2="564"/>
    <line x1="34" y1="564" x2="34" y2="828"/><line x1="26" y1="564" x2="42" y2="564"/><line x1="26" y1="828" x2="42" y2="828"/>
    <line x1="140" y1="748" x2="140" y2="826"/><line x1="132" y1="748" x2="148" y2="748"/><line x1="132" y1="826" x2="148" y2="826"/>
  </g>
  <text x="126" y="646" fill="#000">1.5 m</text>
  <text x="156" y="558" font-size="13" fill="#000">天井から 20 cm</text>
  <text x="28" y="700" text-anchor="middle" transform="rotate(-90 28 700)" fill="#000">2.2 m</text>
  <text x="146" y="792" font-size="13" fill="#000">0.7 m</text>
  <text x="330" y="556" text-anchor="middle" fill="#c0392b">3.5 m</text>

  <!-- 注意 (右) -->
  <text x="560" y="580" font-weight="bold" fill="#000">張るときの決まり</text>
  <text x="560" y="606" fill="#000">・ワイヤはカーテンレール (灰色の線) より上を通す</text>
  <text x="560" y="628" fill="#000">・サッシの枠と金属のレールから 5 cm 以上離す</text>
  <text x="560" y="650" fill="#000">・照明・充電器・コンセントから 1 m 以上離す</text>
  <text x="560" y="672" fill="#000">・マスキングテープで 50 cm おきに留める</text>
  <text x="560" y="694" fill="#000">・カウンターポイズは余っても巻かない</text>
  <text x="560" y="716" fill="#000">・つなぐ前に、ワイヤの先をカウンターポイズに</text>
  <text x="574" y="736" fill="#000">触れさせて放電する</text>
</svg>
