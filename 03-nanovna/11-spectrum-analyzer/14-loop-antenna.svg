<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" font-family="'Noto Sans CJK JP','Noto Sans JP',sans-serif" font-size="15">
  <rect width="760" height="600" fill="#ffffff"/>
  <text x="20" y="32" font-size="20" font-weight="bold" fill="#000">図4 中波帯の同調ループの作り方 (図 3 を組んだ姿)</text>

  <!-- 枠 (木や塩ビの十字枠) -->
  <line x1="260" y1="80" x2="260" y2="420" stroke="#b08850" stroke-width="10"/>
  <line x1="90" y1="250" x2="425" y2="250" stroke="#b08850" stroke-width="10"/>
  <line x1="430" y1="250" x2="445" y2="250" stroke="#7a5a30"/><text x="450" y="255" fill="#7a5a30">十字の枠 (木・塩ビ管)</text>

  <!-- 11 回巻きの主ループ (正方形を 5 mm おきに重ねて描く: 代表として 4 本) -->
  <g fill="none" stroke="#c0392b" stroke-width="2">
    <rect x="100" y="90" width="320" height="320"/>
    <rect x="104" y="94" width="312" height="312"/>
    <rect x="108" y="98" width="304" height="304"/>
    <rect x="112" y="102" width="296" height="296"/>
  </g>
  <text x="440" y="110" fill="#c0392b">L1: 11 回巻き (線の間を 5 mm ほど空ける)</text>
  <text x="440" y="130" fill="#c0392b">ビニル線 φ1 mm、約 175 µH (目安)</text>

  <!-- 1 回巻きのリンク (内側) -->
  <rect x="124" y="114" width="272" height="272" fill="none" stroke="#2471a3" stroke-width="2.5" stroke-dasharray="none"/>
  <text x="440" y="170" fill="#2471a3">L2: 1 回巻きのリンク</text><text x="440" y="190" fill="#2471a3">(L1 の内側に沿わせる)</text><line x1="396" y1="180" x2="435" y2="180" stroke="#2471a3"/>

  <!-- 寸法線 -->
  <g stroke="#000" stroke-width="1">
    <line x1="100" y1="60" x2="420" y2="60"/>
    <line x1="100" y1="54" x2="100" y2="88"/>
    <line x1="420" y1="54" x2="420" y2="88"/>
    <line x1="72" y1="90" x2="72" y2="410"/>
    <line x1="66" y1="90" x2="98" y2="90"/>
    <line x1="66" y1="410" x2="98" y2="410"/>
  </g>
  <polygon points="100,60 110,56 110,64" fill="#000"/>
  <polygon points="420,60 410,56 410,64" fill="#000"/>
  <polygon points="72,90 68,100 76,100" fill="#000"/>
  <polygon points="72,410 68,400 76,400" fill="#000"/>
  <text x="225" y="54">32 cm</text>
  <text x="22" y="255">32 cm</text>

  <!-- 主ループの両端 → 同調の箱 -->
  <g stroke="#c0392b" stroke-width="2" fill="none">
    <polyline points="250,410 250,470"/>
    <polyline points="270,410 270,470"/>
  </g>
  <rect x="180" y="470" width="160" height="72" fill="#f4f4f4" stroke="#000" stroke-width="1.5"/>
  <text x="192" y="494">C2 ポリバリコン</text>
  <text x="192" y="514">S1 + C3 220 pF</text>
  <text x="192" y="532" font-size="13">(L1 の両端に並列)</text>

  <!-- リンクの両端 → 同軸 → tinySA -->
  <g stroke="#2471a3" stroke-width="2.5" fill="none">
    <polyline points="355,386 355,450 470,450"/>
    <polyline points="365,386 365,440 470,440"/>
  </g>
  <rect x="470" y="430" width="30" height="30" fill="#ddd" stroke="#000"/>
  <text x="440" y="425" font-size="13">SMA</text>
  <line x1="500" y1="445" x2="610" y2="445" stroke="#000" stroke-width="5"/>
  <text x="505" y="475" font-size="13">同軸 (損失 L)</text>
  <rect x="610" y="415" width="120" height="60" fill="#f4f4f4" stroke="#000" stroke-width="1.5"/>
  <text x="630" y="450">tinySA</text>

  <!-- 注 -->
  <text x="20" y="575" font-size="13">面積 A ≈ 0.1 m²。金属の机・壁から 1 m 以上離す。L1 と L2 の端は線をより合わせて引き出す。</text>
</svg>
