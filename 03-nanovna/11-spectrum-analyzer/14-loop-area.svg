<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" width="640" height="540" font-family="'Noto Sans CJK JP','Noto Sans JP',sans-serif" font-size="15">
  <rect width="640" height="540" fill="#ffffff"/>
  <text x="20" y="32" font-size="20" font-weight="bold" fill="#000">図1 ループの面積 A と、貫く磁界 H</text>

  <g transform="translate(0,20)">
  <!-- 面積 A (塗り) -->
  <rect x="110" y="90" width="300" height="300" fill="#fdecea"/>

  <!-- N 回巻きのループ (代表として 3 本) と端子のすき間 -->
  <g fill="none" stroke="#c0392b" stroke-width="2.5">
    <polyline points="250,390 110,390 110,90 410,90 410,390 270,390"/>
    <polyline points="250,396 104,396 104,84 416,84 416,396 270,396"/>
    <polyline points="250,402 98,402 98,78 422,78 422,402 270,402"/>
  </g>
  <!-- 端子 -->
  <g stroke="#c0392b" stroke-width="2.5">
    <line x1="250" y1="390" x2="250" y2="450"/>
    <line x1="270" y1="390" x2="270" y2="450"/>
  </g>
  <circle cx="250" cy="452" r="4" fill="#fff" stroke="#000"/>
  <circle cx="270" cy="452" r="4" fill="#fff" stroke="#000"/>
  <text x="285" y="458">V_oc (開放電圧) を tinySA へ</text>

  <!-- H: 紙面を手前から奥へ貫く (⊗) -->
  <g stroke="#2471a3" stroke-width="2" fill="none">
    <circle cx="190" cy="170" r="12"/><line x1="182" y1="162" x2="198" y2="178"/><line x1="198" y1="162" x2="182" y2="178"/>
    <circle cx="330" cy="170" r="12"/><line x1="322" y1="162" x2="338" y2="178"/><line x1="338" y1="162" x2="322" y2="178"/>
    <circle cx="190" cy="310" r="12"/><line x1="182" y1="302" x2="198" y2="318"/><line x1="198" y1="302" x2="182" y2="318"/>
    <circle cx="330" cy="310" r="12"/><line x1="322" y1="302" x2="338" y2="318"/><line x1="338" y1="302" x2="322" y2="318"/>
  </g>
  <text x="160" y="236" fill="#000">面積 A = 0.32 m × 0.32 m</text>
  <text x="200" y="258" fill="#000">≈ 0.1 m²</text>

  <!-- 寸法線 -->
  <g stroke="#000" stroke-width="1">
    <line x1="110" y1="56" x2="410" y2="56"/>
    <line x1="110" y1="50" x2="110" y2="74"/>
    <line x1="410" y1="50" x2="410" y2="74"/>
    <line x1="66" y1="90" x2="66" y2="390"/>
    <line x1="60" y1="90" x2="94" y2="90"/>
    <line x1="60" y1="390" x2="94" y2="390"/>
  </g>
  <polygon points="110,56 120,52 120,60" fill="#000"/>
  <polygon points="410,56 400,52 400,60" fill="#000"/>
  <polygon points="66,90 62,100 70,100" fill="#000"/>
  <polygon points="66,390 62,380 70,380" fill="#000"/>
  <text x="232" y="50">約 32 cm</text>
  <text x="14" y="245">約 32 cm</text>

  <!-- 凡例 -->
  <text x="440" y="110" fill="#c0392b">N 回巻き</text>
  <text x="440" y="130" fill="#c0392b" font-size="13">(図は 3 本だけ描いた)</text>
  <g stroke="#2471a3" stroke-width="2" fill="none">
    <circle cx="452" cy="176" r="10"/><line x1="445" y1="169" x2="459" y2="183"/><line x1="459" y1="169" x2="445" y2="183"/>
  </g>
  <text x="470" y="175" fill="#2471a3">磁界 H</text>
  <text x="470" y="195" fill="#2471a3" font-size="13">(面を垂直に貫く向き)</text>
  <text x="440" y="240" font-size="13">H が面を垂直に貫くとき</text>
  <text x="440" y="258" font-size="13">V_oc が最大になる。</text>
  <text x="440" y="276" font-size="13">ループを回して、読みが</text>
  <text x="440" y="294" font-size="13">最大になる向きを探す</text>

  <text x="20" y="500" font-size="14">V_oc = ω · N · A · μ0 · H。A と N を大きくするほど、同じ H で大きな電圧になる。</text>
</g>
</svg>
